training:
  batch_size: 32
  num_epochs: 100
  learning_rate: 0.0005  # Slightly lower initial LR
  weight_decay: 0.01
  warmup_epochs: 15  # Longer warmup
  device: "auto"
  
  # New anti-freezing parameters
  gradient_clip_norm: 1.0  # Prevent exploding gradients
  min_lr_ratio: 0.01  # Minimum LR = 1% of base LR
  use_cosine_restarts: true  # Restart LR periodically
  restart_period: 20  # Every 20 epochs
  
  # Teacher momentum schedule
  teacher_momentum:
    initial: 0.996
    final: 0.99
    decay_rate: 0.0001
  
  # DINO loss parameters
  dino_loss:
    temperature: 0.1
    adaptive_temp: true  # Dynamically adjust temperature
    min_temp: 0.07
    max_temp: 0.3
    center_momentum: 0.9
    adaptive_center: true  # Use adaptive center updates
    
  # Plateau detection
  plateau_detection:
    enabled: true
    window_size: 50
    threshold: 0.001
    patience: 5
    
  # Recovery mechanisms
  recovery:
    add_noise_on_plateau: true
    noise_std: 0.01
    reset_optimizer_on_plateau: true

model:
  type: "dino"
  mode: "from_scratch"
  backbone:
    name: "vit"
    in_channels: 3
    base_img_size: 140
    patch_size: 14
    embed_dim: 384
    num_heads: 12
    num_layers: 12
    mlp_ratio: 4
    qkv_bias: true
  projection_head:
    hidden_dim: 4096
    output_dim: 256
  input_projection:
    in_channels: 20
    out_channels: 3
    kernel_size: 1
  initialization:
    pos_embed_std: 0.02
    cls_token_std: 0.02
  freeze_backbone: false

data:
  input_channels: 20
  transform_type: "multicrop"
  transforms:
    global_crop_size: 140
    local_crop_size: 60
    mean: null
    std: null
    augmentation:
      color_jitter:
        brightness: 0.4
        contrast: 0.4
      random_crop:
        scale_range: [0.08, 1.0]
        aspect_ratio_range: [0.75, 1.33]
      gaussian_blur:
        kernel_size: 3
      flip_prob: 0.5

logging:
  neptune:
    project: "your-project-name"
    api_token: "${NEPTUNE_API_TOKEN}"
  
  # Enhanced logging for debugging
  log_gradients: true
  log_temperature: true
  log_center_updates: true
  log_plateau_detection: true

optuna:
  enabled: false
  n_trials: 10
  direction: "minimize"
  pruner: "median"
  sampler: "tpe"

metrics:
  - name: "loss"
    direction: "minimize"
  - name: "view_similarity"
    direction: "maximize"
  - name: "gradient_norm"
    direction: "minimize"
  - name: "teacher_momentum"
    direction: "minimize" 