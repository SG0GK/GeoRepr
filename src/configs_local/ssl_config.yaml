training:
  batch_size: 32
  num_epochs: 100
  learning_rate:
    distribution: "float"
    low: 0.00001  # 1e-5
    high: 0.01    # 1e-2
    log: true
  weight_decay:
    distribution: "float"
    low: 0.00001  # 1e-5
    high: 0.01    # 1e-2
    log: true
  warmup_epochs: 10
  device: "auto"  # auto, cuda, or cpu

model:
  type: "dino"
  mode: "from_scratch"
  backbone:
    name: "vit"
    in_channels: 3  # After input projection
    base_img_size: 140
    patch_size: 14
    embed_dim: 384
    num_heads: 12
    num_layers: 12
    mlp_ratio: 4
    qkv_bias: true
  projection_head:
    hidden_dim: 4096
    output_dim: 256
  input_projection:
    in_channels: 20  # Original input channels
    out_channels: 3  # Projected channels
    kernel_size: 1
  initialization:
    pos_embed_std: 0.02
    cls_token_std: 0.02
  freeze_backbone: false

data:
  input_channels: 20
  transform_type: "multicrop"
  transforms:
    global_crop_size: 140
    local_crop_size: 60
    mean: null  # if null, will default to [0.5] * input_channels
    std: null   # if null, will default to [0.5] * input_channels
    augmentation:
      color_jitter:
        brightness: 0.4
        contrast: 0.4
      random_crop:
        scale_range: [0.08, 1.0]
        aspect_ratio_range: [0.75, 1.33]
      gaussian_blur:
        kernel_size: 3
      flip_prob: 0.5

visualization:
  pareto_metrics: ["loss", "view_similarity"]  # Primary metrics to show in Pareto front

logging:
  neptune:
    project: "your-project-name"
    api_token: "${NEPTUNE_API_TOKEN}"
  
optuna:
  enabled: false
  n_trials: 10
  direction: "minimize"
  pruner: "median"
  sampler: "tpe"

metrics:
  - name: "loss"
    direction: "minimize"
  - name: "view_similarity"
    direction: "maximize"
  - name: "student_proj_norm"
    direction: "minimize"
  - name: "teacher_proj_norm"
    direction: "minimize"
  - name: "center_update"
    direction: "minimize" 